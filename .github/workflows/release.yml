name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate release tag
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const packageVersion = JSON.parse(readFileSync("package.json", "utf8")).version;
          const numericIdentifier = "(?:0|[1-9]\\d*)";
          const prereleaseIdentifier = "(?:0|[1-9]\\d*|\\d*[A-Za-z-][0-9A-Za-z-]*)";
          const semver = new RegExp(
            `^v${numericIdentifier}\\.${numericIdentifier}\\.${numericIdentifier}` +
            `(?:-${prereleaseIdentifier}(?:\\.${prereleaseIdentifier})*)?` +
            `(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$`,
          );
          const tag = process.env.GITHUB_REF_NAME;
          if (!semver.test(tag)) throw new Error(`release tag is not SemVer: ${tag}`);
          if (tag !== `v${packageVersion}`) {
            throw new Error(`release tag ${tag} does not match package version ${packageVersion}`);
          }
          NODE
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
