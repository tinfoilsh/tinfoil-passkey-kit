name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: node -e "import('./dist/index.js').then(m => { if (!m.createPasskeyKit) process.exit(1) })"
      - run: npm pack --dry-run

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
